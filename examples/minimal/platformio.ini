; esp-fleet-ota minimal example. Builds for ESP32-C3 and ESP32-S3 to prove the library has no C3-only assumptions.
;   ~/pio-venv/bin/pio run -d examples/minimal -e esp32c3
;   ~/pio-venv/bin/pio run -d examples/minimal -e esp32s3
[platformio]
default_envs = esp32c3

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
monitor_speed = 115200
lib_deps = symlink://../..
lib_ldf_mode = deep+
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall -Wextra
    -DFIRMWARE_VERSION=\"0.1.0\"
    ; LDF does not hand the core's Network lib to WiFi (WiFiGeneric.h includes Network.h)
    -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src

[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DFOTA_BOARD=\"esp32-c3-devkitm-1\"
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DFOTA_BOARD=\"esp32-s3-devkitc-1\"
