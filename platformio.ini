; esp-fleet-ota: host unit tests for the pure logic (pio test -e native).
; The library itself is src/ (library.json). Device builds live in examples/minimal/platformio.ini.
[platformio]
default_envs = native

; Host crypto backend for the tests: OpenSSL libcrypto (Homebrew openssl@3). Override the prefix with
; PLATFORMIO_BUILD_FLAGS or edit here on another host. The device backend is mbedTLS (src/esp/).
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -std=gnu++17
    -Wall -Wextra
    -I src
    -I test/fixtures
    -DFLEET_OTA_WITH_OPENSSL
    -I /opt/homebrew/opt/openssl@3/include
    -L /opt/homebrew/opt/openssl@3/lib
    -lcrypto
